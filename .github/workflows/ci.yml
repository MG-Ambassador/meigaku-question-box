name: CI Verify

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    name: Test & Build Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install root dependencies
        run: npm ci

      - name: Install server dependencies
        run: npm --prefix server ci

      - name: Build server (type check)
        run: npm --prefix server run build

      - name: Lint and type-check frontend
        run: |
          npm run lint
          npx tsc --noEmit

      - name: Run server tests (Unit & Integration)
        run: npm run test:server

      - name: Run data migration dry-run test
        run: npm run test:migration

      - name: Run UI state tests
        run: npm run test:ui-state

      - name: Install test browser
        run: npx playwright install --with-deps chromium

      - name: Run browser acceptance & dev gallery tests
        run: |
          npm run test:ui
          npm run test:ui-gallery

      - name: Upload browser test diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ui-test-results
          path: test-results/
          retention-days: 7

      - name: Build frontend for static export
        run: npm run build
        env:
          NEXT_PUBLIC_API_BASE_URL: 'http://localhost:8080'
          NEXT_PUBLIC_GOOGLE_CLIENT_ID: 'test-client-id.apps.googleusercontent.com'
          NEXT_PUBLIC_BASE_PATH: ''

      - name: Verify static artifacts existence & dev-gallery exclusion
        run: |
          if [ ! -f "out/index.html" ]; then
            echo "Error: out/index.html not found"
            exit 1
          fi
          if [ ! -f "out/admin/index.html" ]; then
            echo "Error: out/admin/index.html not found"
            exit 1
          fi
          if grep -rn "開発用UI部品ギャラリー\|ComponentGallery" out/; then
            echo "Error: Dev-only UI gallery strings leaked into production build (out/)"
            exit 1
          fi
          echo "All static artifacts and production bundle exclusions verified successfully."
