openapi: 3.1.0
info:
  title: Meigaku Question Box API
  version: 1.0.0
  description: 明治学院大学の来場者向け匿名質問箱システム（Cloud Run API サーバー仕様）

servers:
  - url: http://localhost:8080
    description: ローカル開発環境
  - url: https://api.meigaku-question-box.example.com
    description: 本番環境（Cloud Run）

paths:
  /health:
    get:
      summary: サーバー生存確認
      description: サーバープロセスのヘルスチェック。DB内容は返さない。
      responses:
        '200':
          description: 正常稼働中
          content:
            application/json:
              schema:
                type: object
                required: [status, timestamp]
                properties:
                  status:
                    type: string
                    example: ok
                  timestamp:
                    type: integer
                    example: 1789610000000

  /api/events:
    get:
      summary: 受付中イベント一覧の取得
      description: '来場者向けに、現在質問受付中（open: true）のイベント一覧を返す。'
      responses:
        '200':
          description: 受付中イベントの配列
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Event'
        '503':
          $ref: '#/components/responses/StorageUnavailable'
    post:
      summary: イベントの新規作成
      description: 運営担当者が新しいイベントを作成する。初期集計（eventStats）および監査ログを同時作成する。
      security:
        - SessionToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateEventInput'
      responses:
        '201':
          description: 作成成功
          content:
            application/json:
              schema:
                type: object
                required: [id, ok]
                properties:
                  id:
                    type: string
                  ok:
                    type: boolean
                    example: true
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          $ref: '#/components/responses/StorageUnavailable'

  /api/events/{id}:
    get:
      summary: イベント詳細の取得
      description: 指定されたイベントの公開メタデータを取得する。
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: イベント詳細
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Event'
        '404':
          $ref: '#/components/responses/EventNotFound'
        '503':
          $ref: '#/components/responses/StorageUnavailable'
    patch:
      summary: イベント設定の更新
      description: 運営担当者がイベントのタイトル、日時、受付状態を更新する。楽観的ロック（version）を使用。
      security:
        - SessionToken: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchEventInput'
      responses:
        '200':
          description: 更新成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Event'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/EventNotFound'
        '409':
          description: バージョン競合（他者が先に更新）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '503':
          $ref: '#/components/responses/StorageUnavailable'

  /api/events/{id}/lifecycle:
    post:
      summary: イベント・ルームの状態遷移（アーカイブ・ごみ箱・復元）
      description: 運営担当者がイベントの状態（通常/アーカイブ/ごみ箱）を安全に遷移させる。ごみ箱からの復元先はアーカイブ。
      security:
        - SessionToken: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action, version]
              properties:
                action:
                  type: string
                  enum: [archive, unarchive, trash, restore]
                version:
                  type: integer
      responses:
        '200':
          description: 状態更新成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Event'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/EventNotFound'
        '409':
          $ref: '#/components/responses/VersionConflict'
        '503':
          $ref: '#/components/responses/StorageUnavailable'

  /api/questions:
    post:
      summary: 質問の匿名投稿
      description: 来場者からの質問を投稿する。requestId による冪等性担保、IP による連投制限、集計更新を原子的に行う。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QuestionSubmissionInput'
      responses:
        '201':
          description: 新規受付完了
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuestionSubmissionResponse'
        '200':
          description: 冪等な再送受付完了（同一キー・同一内容）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuestionSubmissionResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '409':
          description: イベント閉鎖中、または同一キーでの内容不一致競合
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '429':
          description: レート制限（10分間に5件超過）
          headers:
            Retry-After:
              schema:
                type: integer
              description: 次の投稿が可能になるまでの秒数
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '503':
          $ref: '#/components/responses/SubmissionUncertain'

  /api/admin/me:
    get:
      summary: 運営ユーザーの認可確認
      description: セッショントークンを検証し、ログイン中の運営者情報を返す。初回パスワード変更前（mustChange=true）でも参照できる。
      security:
        - SessionToken: []
      responses:
        '200':
          description: 認証成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminMeResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/admin/events:
    get:
      summary: イベント一覧の取得（管理用）
      description: 運営担当者向けに、閉鎖中・アーカイブ・ごみ箱を含むイベント一覧を取得する。
      security:
        - SessionToken: []
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [active, archived, deleted]
          description: イベント・ルームの状態（active/archived/deleted）
      responses:
        '200':
          description: イベント配列
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Event'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          $ref: '#/components/responses/StorageUnavailable'

  /api/admin/questions/{id}/favorite:
    put:
      summary: 質問のお気に入り登録・解除（個人用）
      description: ログイン中の担当者専用のお気に入り状態を希望値に更新する。
      security:
        - SessionToken: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: 質問ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [favorite]
              properties:
                favorite:
                  type: boolean
      responses:
        '200':
          description: お気に入り更新成功
          content:
            application/json:
              schema:
                type: object
                required: [ok, questionId, favorite]
                properties:
                  ok:
                    type: boolean
                  questionId:
                    type: string
                  favorite:
                    type: boolean
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: 質問またはイベントが見つからない
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '503':
          $ref: '#/components/responses/StorageUnavailable'

  /api/admin:
    get:
      summary: イベント集計および質問一覧の取得
      description: 選択されたイベントの集計情報（合計、テーマ別、流入元別、日別）および質問一覧を取得する。検索条件（テーマ、並び順、お気に入り、日別、流入元）およびカーソルページネーション対応。
      security:
        - SessionToken: []
      parameters:
        - name: event
          in: query
          required: true
          schema:
            type: string
          description: イベントID
        - name: pageSize
          in: query
          required: false
          schema:
            type: integer
            default: 50
            minimum: 1
            maximum: 100
        - name: cursor
          in: query
          required: false
          schema:
            type: string
          description: 次ページ取得用の署名付き不透明カーソル
        - name: category
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/Category'
        - name: sort
          in: query
          required: false
          schema:
            type: string
            enum: [newest, oldest, theme]
            default: newest
        - name: favorite
          in: query
          required: false
          schema:
            type: string
            enum: [all, favorite]
            default: all
        - name: day
          in: query
          required: false
          schema:
            type: string
            example: '2026-09-30'
        - name: source
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/Source'
      responses:
        '200':
          description: 集計および質問一覧
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminReport'
        '400':
          description: 不正なリクエストまたは改ざんされたカーソル
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: カーソル失効（期限切れ、またはデータ版変更）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '503':
          $ref: '#/components/responses/StorageUnavailable'

  /api/auth/login:
    post:
      summary: 運営ログイン
      description: 運営ID・パスワードを検証してセッショントークンを発行する。未登録ID・誤パスワード・利用停止はすべて同じ 401。試行は同一IPで10分30回、同一IDで15分10回まで。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [loginId, password]
              properties:
                loginId: { type: string, maxLength: 100, example: mga-staff }
                password: { type: string, maxLength: 128 }
      responses:
        '200':
          description: ログイン成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSession'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          description: 運営IDまたはパスワードが正しくない（INVALID_CREDENTIALS）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '429':
          $ref: '#/components/responses/RateLimited'

  /api/auth/logout:
    post:
      summary: 運営ログアウト
      description: 現在のセッションを無効化する。
      security:
        - SessionToken: []
      responses:
        '200':
          description: ログアウト完了
        '401':
          $ref: '#/components/responses/Unauthenticated'

  /api/auth/password:
    post:
      summary: パスワード変更
      description: 現在のパスワードを確認して変更する（15〜128文字、現在と異なること）。全端末のセッションを無効化し、新しいセッションを返す。初回パスワード変更前でも利用できる。
      security:
        - SessionToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [currentPassword, newPassword]
              properties:
                currentPassword: { type: string, maxLength: 128 }
                newPassword: { type: string, minLength: 15, maxLength: 128 }
      responses:
        '200':
          description: 変更成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSession'
        '400':
          description: 規則違反（VALIDATION_ERROR）または現在のパスワード誤り（INVALID_CURRENT_PASSWORD）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '409':
          description: 変更中にアカウントが更新された（ACCOUNT_CHANGED）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '429':
          $ref: '#/components/responses/RateLimited'

  /api/admin/operators:
    get:
      summary: 担当者一覧（運営責任者専用）
      security:
        - SessionToken: []
      responses:
        '200':
          description: 担当者の配列（パスワードハッシュは含まない）
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Operator'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      summary: 担当者の追加（運営責任者専用）
      description: 一般担当者を作成し、仮パスワードをこの応答で一度だけ返す。担当者は初回ログイン時にパスワード変更が必要。
      security:
        - SessionToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [loginId, displayName]
              properties:
                loginId: { type: string, pattern: '^[a-zA-Z0-9_-]{3,40}$' }
                displayName: { type: string, maxLength: 60 }
      responses:
        '201':
          description: 作成成功
          content:
            application/json:
              schema:
                type: object
                required: [loginId, displayName, temporaryPassword]
                properties:
                  loginId: { type: string }
                  displayName: { type: string }
                  temporaryPassword: { type: string }
        '400':
          $ref: '#/components/responses/ValidationError'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: 運営IDが既に使われている（OPERATOR_EXISTS）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'

  /api/admin/operators/{id}/{action}:
    post:
      summary: 仮パスワード再発行・利用停止・利用再開（運営責任者専用）
      description: 一般担当者だけが対象。自分自身と他の運営責任者は変更できない。いずれも対象者の全セッションを無効化する。
      security:
        - SessionToken: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - name: action
          in: path
          required: true
          schema:
            type: string
            enum: [reset, disable, enable]
      responses:
        '200':
          description: 更新成功（reset のときのみ temporaryPassword を含む）
          content:
            application/json:
              schema:
                type: object
                required: [ok, loginId, active, mustChange]
                properties:
                  ok: { type: boolean }
                  loginId: { type: string }
                  active: { type: boolean }
                  mustChange: { type: boolean }
                  temporaryPassword: { type: string }
        '400':
          description: 不正な操作（INVALID_ACTION）または自分自身への操作（SELF_OPERATION）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: 担当者が見つからない（OPERATOR_NOT_FOUND）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'

components:
  securitySchemes:
    SessionToken:
      type: http
      scheme: bearer
      bearerFormat: opaque
      description: POST /api/auth/login で発行される運営セッショントークン（64桁の16進数、有効期限8時間）。サーバーにはSHA-256のみ保存する。

  schemas:
    Event:
      type: object
      required: [id, title, date, open, created_at]
      properties:
        id:
          type: string
          example: oc-2026-summer
        title:
          type: string
          example: オープンキャンパス2026夏
        date:
          type: string
          example: 2026年8月1日・白金キャンパス
        open:
          type: integer
          enum: [0, 1]
          example: 1
        status:
          type: string
          enum: [active, archived, deleted]
          default: active
          example: active
        version:
          type: integer
          example: 1
        created_at:
          type: integer
          example: 1789453299610
        updated_at:
          type: integer
          example: 1789453299610

    CreateEventInput:
      type: object
      required: [title]
      properties:
        id:
          type: string
          description: 任意指定のイベントID（未指定時はUUID自動生成）
        title:
          type: string
          minLength: 1
          maxLength: 100
        date:
          type: string
          maxLength: 100
          default: ''
        open:
          type: boolean
          default: true
        requestId:
          type: string
          format: uuid

    PatchEventInput:
      type: object
      required: [version]
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 100
        date:
          type: string
          maxLength: 100
        open:
          type: boolean
        version:
          type: integer
          description: 楽観的ロック用の現バージョン番号

    QuestionSubmissionInput:
      type: object
      required: [eventId, body, category, requestId]
      properties:
        eventId:
          type: string
        body:
          type: string
          minLength: 1
          maxLength: 500
          description: 質問本文（トリム後1〜500文字）
        category:
          type: string
          enum: [大学生活, 学び・授業, 入試・進路, 留学・国際交流, その他]
        source:
          type: string
          enum: [web, instagram]
          default: web
        requestId:
          type: string
          format: uuid
          description: クライアント生成の再送識別子

    QuestionSubmissionResponse:
      type: object
      required: [ok, id, requestId]
      properties:
        ok:
          type: boolean
          example: true
        id:
          type: string
          description: 質問のドキュメントID (SHA-256(requestId))
        requestId:
          type: string
          format: uuid

    AdminMeResponse:
      type: object
      required: [displayName, sub, loginId, role, mustChange]
      properties:
        displayName:
          type: string
          example: 運営担当者
        sub:
          type: string
          description: 運営ID（loginId と同じ値。監査ログ・お気に入りの識別子）
          example: mga-staff
        loginId:
          type: string
          example: mga-staff
        role:
          type: string
          enum: [owner, operator]
        mustChange:
          type: boolean
          description: true の間は初回パスワード変更が必要で、他の運営APIは 403 PASSWORD_CHANGE_REQUIRED

    AuthSession:
      type: object
      required: [token, expiresAt, user]
      properties:
        token:
          type: string
          description: 'セッショントークン（Authorization: Bearer に付けて送る）'
        expiresAt:
          type: integer
          description: 有効期限（UNIXミリ秒）
        user:
          $ref: '#/components/schemas/AdminMeResponse'

    Operator:
      type: object
      required: [loginId, displayName, role, active, mustChange, createdAt]
      properties:
        loginId: { type: string }
        displayName: { type: string }
        role: { type: string, enum: [owner, operator] }
        active: { type: boolean }
        mustChange: { type: boolean }
        createdAt: { type: integer }

    QuestionRow:
      type: object
      required: [id, body, category, source, created_at]
      properties:
        id:
          type: string
        body:
          type: string
        category:
          type: string
        categoryOrder:
          type: integer
          example: 0
        source:
          type: string
        created_at:
          type: integer
        sequence:
          type: integer
        isFavorite:
          type: boolean
          default: false
          example: true

    AdminReport:
      type: object
      required: [total, pageSize, hasNext, generatedAt, categories, sources, days, rows]
      properties:
        total:
          type: integer
          example: 42
        favoriteRevision:
          type: integer
          description: 個人・ルーム単位のお気に入り版番号。変更時は既存のお気に入りcursorが失効する。
        filteredTotal:
          type: integer
          example: 12
        pageSize:
          type: integer
          example: 50
        hasNext:
          type: boolean
          example: false
        nextCursor:
          type: string
          nullable: true
        generatedAt:
          type: integer
          example: 1789610000000
        categories:
          type: array
          items:
            type: object
            required: [category, count]
            properties:
              category:
                type: string
              count:
                type: integer
        sources:
          type: array
          items:
            type: object
            required: [source, count]
            properties:
              source:
                type: string
              count:
                type: integer
        days:
          type: array
          items:
            type: object
            required: [day, count]
            properties:
              day:
                type: string
                example: '2026-09-17'
              count:
                type: integer
        rows:
          type: array
          items:
            $ref: '#/components/schemas/QuestionRow'

    ApiError:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              example: VALIDATION_ERROR
            message:
              type: string
              example: 入力内容を確認してください。
            traceId:
              type: string
              format: uuid
            retryAfterSeconds:
              type: integer

  responses:
    RateLimited:
      description: 試行回数の上限超過（RATE_LIMITED）
      headers:
        Retry-After:
          schema:
            type: integer
          description: 再試行できるまでの秒数
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    ValidationError:
      description: 入力値不正
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    Unauthenticated:
      description: 認証未実施またはトークン無効
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    Forbidden:
      description: 権限なし（初回パスワード変更前、または運営責任者専用の操作）
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    EventNotFound:
      description: 指定されたイベントが存在しない
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    PayloadTooLarge:
      description: リクエストボディが8KB制限を超過
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    SubmissionUncertain:
      description: DB競合・タイムアウト等のため結果確認不能（クライアントは同一キーで再送可能）
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    StorageUnavailable:
      description: データベース一時障害
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
